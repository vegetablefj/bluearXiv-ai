name: arXiv Daily Paper Pipeline (TeX + HTML)

on:
  schedule:
    - cron: '0 4 * * 1-5'  # 北京时间周一至周五 12:00
  workflow_dispatch:
    inputs:
      date:
        description: '预期的北京时间日报日期（YYYY-MM-DD，可选）'
        type: string
      test_mode:
        description: '仅生成最多三篇论文的预览，不调用 AI 或发布'
        type: boolean
        default: false
      skip_fetch:
        description: '使用同仓库此前运行的 arxiv-source 缓存'
        type: boolean
        default: false
      source_run_id:
        description: '启用 skip_fetch 时，指定已有源缓存的 Actions 运行 ID'
        type: string
      ai_model_name:
        description: 'DeepSeek 模型名称'
        type: string
        default: 'deepseek-chat'

concurrency:
  group: arxiv-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      AI_MODEL_NAME: ${{ inputs.ai_model_name || 'deepseek-chat' }}

    steps:
      - name: Validate source options
        env:
          SKIP_FETCH: ${{ inputs.skip_fetch }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ "$SKIP_FETCH" == true && ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::启用 skip_fetch 时须提供含有 arxiv-source 产物的 source_run_id"
            exit 1
          fi
          if [[ "$SKIP_FETCH" != true && -n "$SOURCE_RUN_ID" ]]; then
            echo "::error::仅在启用 skip_fetch 时填写 source_run_id"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download source cache
        if: inputs.skip_fetch
        uses: actions/download-artifact@v8
        with:
          name: arxiv-source
          path: ${{ runner.temp }}/arxiv-cache
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Check source and generate report
        id: pipeline
        env:
          DEEPSEEK_API_KEY: ${{ !inputs.test_mode && secrets.DEEPSEEK_API_KEY || '' }}
          REPORT_DATE: ${{ inputs.date }}
          SKIP_FETCH: ${{ inputs.skip_fetch }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: |
          args=(--artifact-dir "$RUNNER_TEMP/arxiv-report")
          if [[ "$SKIP_FETCH" == true ]]; then
            args+=(--cache-dir "$RUNNER_TEMP/arxiv-cache")
          else
            args+=(--cache-output-dir "$RUNNER_TEMP/arxiv-source")
          fi
          if [[ "$TEST_MODE" == true ]]; then
            args+=(--test-mode)
          fi
          if [[ -n "$REPORT_DATE" ]]; then
            args+=(--date "$REPORT_DATE")
          fi
          python scripts/run_pipeline.py "${args[@]}"

      - name: Upload source cache
        if: "!cancelled() && steps.pipeline.outputs.cache_ready == 'true'"
        uses: actions/upload-artifact@v7
        with:
          name: arxiv-source
          path: ${{ runner.temp }}/arxiv-source/
          if-no-files-found: error
          retention-days: 7

      - name: Upload this report
        if: steps.pipeline.outputs.result == 'generated' || steps.pipeline.outputs.result == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: arxiv-${{ steps.pipeline.outputs.result }}-${{ steps.pipeline.outputs.report_date }}
          path: ${{ runner.temp }}/arxiv-report/
          if-no-files-found: error
          retention-days: 7

      - name: Publish successful results to main
        if: github.ref == 'refs/heads/main' && !inputs.test_mode
        id: publish
        env:
          RESULT: ${{ steps.pipeline.outputs.result }}
          REPORT_DATE: ${{ steps.pipeline.outputs.report_date }}
        run: |
          if [[ "$RESULT" == generated ]]; then
            git add -- docs/ latest.tex data/pipeline_state.json
          elif [[ "$RESULT" == unchanged ]]; then
            git add -- docs/index.html
            if [[ -f data/pipeline_state.json ]]; then
              git add -- data/pipeline_state.json
            fi
          else
            echo "::error::缺少成功的日报处理结果"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RESULT" == generated ]]; then
            message="自动生成: arXiv 日报 $REPORT_DATE [TeX + HTML]"
          else
            message="更新 arXiv 公告检查时间"
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "$message"
          git push origin HEAD:refs/heads/main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Create workflow summary
        if: always()
        env:
          RESULT: ${{ steps.pipeline.outputs.result }}
          SOURCE_DATE: ${{ steps.pipeline.outputs.source_date }}
          REPORT_DATE: ${{ steps.pipeline.outputs.report_date }}
          PAPER_COUNT: ${{ steps.pipeline.outputs.paper_count }}
          PUSHED: ${{ steps.publish.outputs.pushed }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## arXiv 日报运行结果"
            echo
            echo "- 工作流状态: $JOB_STATUS"
            if [[ -n "$SOURCE_DATE" ]]; then
              echo "- arXiv 公告日期: $SOURCE_DATE"
              echo "- 北京时间日报日期: $REPORT_DATE"
              echo "- 源论文数: $PAPER_COUNT"
            fi
            case "$RESULT" in
              generated) echo "- 已生成 TeX 和 HTML 日报" ;;
              unchanged) echo "- 未发现需要生成的新日报" ;;
              test) echo "- 已生成测试预览" ;;
              *) echo "- 未完成日报处理" ;;
            esac
            if [[ "$PUSHED" == true ]]; then
              echo "- 已推送到 main"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
